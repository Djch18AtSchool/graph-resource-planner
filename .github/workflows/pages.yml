name: Pruebas y despliegue en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false            # no interrumpir un despliegue de Pages en curso

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --locked
      - name: Pruebas unitarias e integracion (cobertura minima 80%)
        run: uv run pytest --cov --cov-fail-under=80
      - name: Construir el sitio
        run: uv run python -m scripts.build_web --out dist
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - name: Instalar dependencias y Chromium
        run: |
          uv sync --locked --group e2e
          uv run --group e2e playwright install --with-deps chromium
      - name: Pruebas E2E (Pyodide en Chromium)
        run: uv run --group e2e pytest -m e2e
        env:
          E2E_BROWSER_CHANNEL: chromium

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
