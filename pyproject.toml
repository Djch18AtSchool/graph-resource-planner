[project]
name = "graph-resource-planner"
version = "1.0.0"
description = "Asignacion de recursos por coloracion de grafos (DSatur y Welsh-Powell)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Grupo 2 - Matematica Discreta II (CENFOTEC, C3-2026)" }]
dependencies = [
    "networkx>=3.4",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]
e2e = [
    "pytest-playwright>=0.10.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -m 'not e2e'"
markers = ["e2e: pruebas end-to-end en navegador (uv run --group e2e pytest -m e2e)"]

[tool.coverage.run]
source = ["graph_core", "visualization", "benchmarks", "scripts"]
omit = ["visualization/web/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
