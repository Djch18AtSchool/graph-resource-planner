name: Pruebas y despliegue en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false            # no interrumpir un despliegue de Pages en curso

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Instalar dependencias
        run: |
          uv sync --locked
          pnpm --dir web install --frozen-lockfile
      - name: Pruebas del motor en Python (cobertura minima 80%)
        run: uv run pytest --cov --cov-fail-under=80
      - name: Pruebas de la interfaz (Vitest)
        run: pnpm --dir web test
      - name: Construir el sitio (React + motor Python empaquetado)
        run: pnpm --dir web build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: web/dist
          include-hidden-files: true
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: web/dist
      - name: Instalar dependencias y Chromium
        run: |
          uv sync --locked --group e2e
          uv run --group e2e playwright install --with-deps chromium
      - name: Pruebas E2E (Pyodide en Chromium)
        run: uv run --group e2e pytest -m e2e
        env:
          E2E_BROWSER_CHANNEL: chromium

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
